[project]
name = "dia-infer"
version = "0.1.0"
description = "Streaming Dia TTS engine (msingiai/dia, nari@052a840 + LANG2BYTE). Serve on A10 for S2S."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchaudio",
  "soundfile",
  "numpy",
  "huggingface-hub",
  "descript-audio-codec",
  "pydantic",
  "python-dotenv",
  "fastapi",
  "uvicorn",
  "websockets",
]

[project.optional-dependencies]
modal = ["modal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dia_infer", "dia"]
