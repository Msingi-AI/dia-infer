[project]
name = "dia-infer"
version = "0.1.0"
description = "Inference for msingiai/dia (nari@052a840 + LANG2BYTE). Local smoke + Modal A10 serve."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
  "soundfile>=0.12.0",
  "numpy",
  "huggingface-hub>=0.30.0",
  "descript-audio-codec>=1.0.0",
  # Keep modern numba; DAC→librosa can otherwise resolve to ancient llvmlite
  "numba>=0.60.0",
  "llvmlite>=0.43.0",
  "pydantic",
  "python-dotenv>=1.0.0",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "websockets",
]

[project.optional-dependencies]
# Do not install `modal` into a Modal container image — it conflicts with the
# platform runtime. Use this extra only on the host for `modal deploy`.
modal = ["modal>=1.5.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dia_infer", "dia"]

[tool.uv]
package = true
